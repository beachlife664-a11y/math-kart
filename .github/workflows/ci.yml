name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Hosted runners have no hardware WebGL. Run the deterministic and production
      # asset checks here; verify:local retains the full real-input graphics suite.
      - run: npm run verify:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-evidence
          path: artifacts/reproduction/
          if-no-files-found: ignore
